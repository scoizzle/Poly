name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Poly.slnx

      - name: Build
        run: dotnet build Poly.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Poly.Tests/Poly.Tests.csproj --configuration Release --no-build --verbosity normal

  image-artifact:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute image tag
        id: tag
        run: echo "tag=poly-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Publish linux-x64 image payload
        run: |
          mkdir -p artifacts
          dotnet publish Playground/Playground.csproj \
            --configuration Release \
            --os linux \
            --arch x64 \
            --self-contained false \
            -o "artifacts/${{ steps.tag.outputs.tag }}"

      - name: Package tagged artifact
        run: |
          tar -czf "${{ steps.tag.outputs.tag }}.tar.gz" -C artifacts "${{ steps.tag.outputs.tag }}"

      - name: Upload tagged image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tag }}
          path: ${{ steps.tag.outputs.tag }}.tar.gz
