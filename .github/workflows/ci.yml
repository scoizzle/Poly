name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Vulnerability data changes without a commit; one audit a day keeps a clean
    # pull request from hiding a package that was fine when it was written.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    # A normal job is about 6 minutes (build, then a 3-4 minute test run). The test run's own
    # --timeout (10m), the script's 630 s kill and the test step's 12m end a hang first and leave the naming and upload
    # steps room on a cold cache; this is the backstop for everything else, not a budget: it replaces GitHub's 360-minute default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --nologo -p:NuGetAudit=false

      # Every project the solution names, not one entry point: a compile break in a
      # shipped pack (src/Poly.Packs.*) or in demo/Poly.RestApi used to be invisible.
      - name: Build
        run: dotnet build Poly.slnx --no-restore --nologo

      - name: Stop build servers
        run: dotnet build-server shutdown

      # The test command runs under scripts/run-with-deadline.sh, which ends the step ITSELF (a
      # failed step, so the next steps run) in three ways, earliest first:
      #   - --timeout 10m in the test host ends an async hang cleanly, with a summary (exit 3);
      #   - the script's memory watchdog SIGKILLs the whole process group when SwapFree falls below
      #     1000 MB (when swap is larger than that) or MemAvailable stays below 200 MB on two samples; the thresholds are judgement
      #     from TWO green runs (PR #892: 4 cores, 15982 MB; lowest sampled MemAvailable 560 MB and
      #     1275 MB, a spread of about 700 MB between runs; swap first used near 900 MB). The hypothesis (#870) is that a starved runner stops enforcing the
      #     step timeout and any watchdog that must fork, so only the server's 20-minute job limit ends
      #     the job and no log survives. A heartbeat every 30 s and one `memory:` summary line measure it;
      #   - the script's 630 s deadline SIGKILLs the group: a host blocked on a synchronous wait ignores
      #     a polite stop (PR #878).
      # The step's timeout-minutes: 12 and the job's 20 are backstops for the script itself.
      # The diagnostic log records a start and an end event per test (the console prints only
      # the end), so the next step can name a test that started and never finished.
      - name: Run tests
        id: tests
        timeout-minutes: 12
        env:
          MALLOC_ARENA_MAX: '2'
        run: >
          scripts/run-with-deadline.sh 630
          dotnet run --project Poly.Tests/Poly.Tests.csproj --no-restore --
          --timeout 10m
          --diagnostic --diagnostic-output-directory "$RUNNER_TEMP/test-diag" --diagnostic-synchronous-write

      # Prints nothing on a healthy run and never fails the job: the kernel's own account of an
      # out-of-memory kill, if the runner was starved (#870).
      - name: Kernel messages (OOM)
        if: always()
        run: |
          sudo dmesg -T 2>/dev/null | grep -i -E 'out of memory|oom-kill|killed process' | tail -20 || true
          journalctl -k --no-pager 2>/dev/null | grep -i -E 'oom-kill|out of memory|killed process' | tail -20 || true

      # Runs on every build, so each green run proves the parser still matches the log: it fails
      # (::error::) when there is no diagnostic file or no start record, and prints the counts.
      # Starts and ends are compared as multisets (no de-duplication), so a test that started N
      # times and finished N-1 times is listed. A test the per-test [Timeout] already failed
      # counts as finished, so tests that ended Timeout/Cancelled/Failed/Error are listed too.
      - name: Name tests that started and never finished
        if: ${{ always() && steps.tests.conclusion != 'skipped' }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/test-diag/*.diag)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no .diag file in $RUNNER_TEMP/test-diag after the test step ran"
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            records=$(awk '/^20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]T/ { if (r != "") print r; r = ""; next } /^TestNodeUpdateMessage \{/ { r = $0; next } r != "" { r = r " " $0 } END { if (r != "") print r }' "$f")
            uid() { sed -n 's/.*TestNode { Uid = TestNodeUid { Value = \(.*\) }, DisplayName = .*/\1/p' | sort; }
            started=$(printf '%s\n' "$records" | grep 'InProgressTestNodeStateProperty' | uid)
            finished=$(printf '%s\n' "$records" | grep -E '(Passed|Failed|Error|Timeout|Cancelled|Skipped)TestNodeStateProperty' | uid)
            bad=$(printf '%s\n' "$records" | grep -E '(Failed|Error|Timeout|Cancelled)TestNodeStateProperty' | uid)
            ns=$(printf '%s\n' "$started" | grep -c .) || true
            nf=$(printf '%s\n' "$finished" | grep -c .) || true
            echo "$(basename "$f"): started: $ns, finished: $nf"
            if [ "$ns" -eq 0 ]; then
              echo "::error::no test start record parsed from $f; the log format may have changed"
              rc=1
            fi
            echo "started and never finished:"
            comm -23 <(printf '%s\n' "$started") <(printf '%s\n' "$finished") | grep . | sed 's/^/  /' || true
            echo "ended Failed, Error, Timeout or Cancelled (a Timeout may leave its thread stuck):"
            printf '%s\n' "$bad" | grep . | sed 's/^/  /' || true
          done
          exit $rc

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/test-diag
          if-no-files-found: ignore
          retention-days: 3

  audit:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    # Restore above turns the audit off so a PR is not blocked on the network; this
    # job turns it back on and is the thing that gates.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Audit direct and transitive packages
        # NuGet audit reports as warnings; promote only the audit ids so an unrelated
        # warning does not fail this job. The list is %3B-escaped: bash strips the quotes,
        # MSBuild then reads the second id as a switch and dies with MSB1006.
        run: |
          dotnet restore Poly.slnx --nologo -p:NuGetAudit=true "-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"
          dotnet list Poly.slnx package --vulnerable --include-transitive
