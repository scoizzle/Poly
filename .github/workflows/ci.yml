name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --nologo -p:NuGetAudit=false

      - name: Build
        run: dotnet build Poly.Benchmarks/Poly.Benchmarks.csproj --no-restore --nologo

      - name: Run tests
        run: dotnet run --project Poly.Tests/Poly.Tests.csproj --no-restore